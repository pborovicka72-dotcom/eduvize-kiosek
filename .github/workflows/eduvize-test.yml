name: Eduvize – nasadit do testu
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: eduvize-test-${{ github.repository }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository_owner == 'pborovicka72-dotcom'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kiosk_test
          POSTGRES_PASSWORD: kiosk_test
          POSTGRES_DB: kiosk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kiosk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4
        with:
          persist-credentials: false
      - name: Shared design-system fixtures
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: pborovicka72-dotcom/eduvize-styly
          ref: dada4d9e02b43eb6b4b7db66cbf0b10f1eedb3a2
          path: .test-design-system
          persist-credentials: false
      - name: Link shared test fixtures
        run: ln -s "$GITHUB_WORKSPACE/.test-design-system" ../eduvize-styly
      - name: Kiosk regression and environment isolation
        run: node --test tests/*.test.mjs tests/*.test.cjs
      - name: Pinned shared output backend
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: pborovicka72-dotcom/eduvize-admin
          ref: 162cd485b4b1150a207a7c1c32344b990c2f9933
          path: .test-output-admin
          persist-credentials: false
      - name: Install adapter integration dependencies
        run: python -m pip install -r .test-output-admin/requirements.txt .
      - name: Kiosk output HTTP lifecycle and immutable media
        env:
          PYTHONPATH: .test-output-admin:.
        run: python -m unittest discover -s tests -p test_output_adapter.py -v
      - name: Kiosk output integration on isolated PostgreSQL 18
        env:
          PYTHONPATH: .test-output-admin:.
          OUTPUT_TEST_DATABASE_URL: postgresql://kiosk_test:kiosk_test@127.0.0.1:5432/kiosk_test
        run: python -m unittest discover -s tests -p test_output_adapter.py -v
  test-deployment:
    needs: verify
    if: github.repository_owner == 'pborovicka72-dotcom' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Package tracked source without private credentials
        run: git archive --format=tar.gz HEAD -o "$RUNNER_TEMP/source.tar.gz"
      - name: Authenticate using short-lived GitHub identity and deploy test
        shell: python
        run: |
          import json, os, time, urllib.request
          base='https://test.skola.eduvize.cz/_deploy'
          request=urllib.request.Request(os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']+'&audience='+base,headers={'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(request,timeout=30) as r:token=json.load(r)['value']
          payload=open(os.environ['RUNNER_TEMP']+'/source.tar.gz','rb').read()
          request=urllib.request.Request(base+'/stage',data=payload,method='POST',headers={'Authorization':'Bearer '+token,'Content-Type':'application/octet-stream'})
          with urllib.request.urlopen(request,timeout=90) as r:job=json.load(r)['job']
          for attempt in range(130):
              with urllib.request.urlopen(base+'/status/'+job,timeout=30) as r:result=json.load(r)
              if result['status']=='failed':raise SystemExit(result['error'])
              if result['status'] in ('passed','published'):
                  with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('## Eduvize\n\nVydání: `'+result['release']+'`\n\nStav: '+result['status']+'\n\n[Otevřít prostředí]('+result['url']+')\n')
                  print('Release:',result['release'],'Status:',result['status']);break
              time.sleep(20)
          else:raise SystemExit('Deployment timed out; inspect VPS journal before trying again.')
