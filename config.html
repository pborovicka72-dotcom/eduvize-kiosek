<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eduvize | Konfigurace kiosku</title><style>:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#142c46}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 95% 0,#d8f8ef,transparent 35%),#edf5fa}.wrap{max-width:1280px;margin:auto;padding:clamp(16px,3vw,42px)}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.eyebrow{font-weight:800;color:#078fa2;letter-spacing:.14em;font-size:13px}h1{margin:5px 0;font-size:clamp(28px,3.5vw,48px);letter-spacing:-.04em}.muted{color:#637f97}a{color:#087b9d}.hero{border-radius:24px;background:linear-gradient(110deg,#0874b8,#00a995);padding:32px;color:white;margin-bottom:22px;box-shadow:0 16px 35px #0b6c9a20}.hero h2{margin:0;font-size:clamp(26px,3vw,42px)}.hero p{margin-bottom:0;opacity:.9}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.tile{border:1px solid #dce8ef;border-radius:20px;background:white;padding:28px 18px;min-height:155px;text-align:center;cursor:pointer;color:#183b55;box-shadow:0 8px 25px #153b5410}.tile:hover,.tile:focus-visible{outline:3px solid #00a995;transform:translateY(-2px)}.tile .ico{font-size:40px;display:block;margin-bottom:12px}.tile strong{font-size:21px}.tile small{display:block;color:#638098;margin-top:8px}.btn{border:0;border-radius:10px;background:#e5f0f4;color:#16506c;padding:11px 16px;cursor:pointer;font-weight:750;text-decoration:none;display:inline-block}.btn.primary{background:linear-gradient(110deg,#0874b8,#00a995);color:#fff}.toolbar{display:flex;gap:10px;flex-wrap:wrap}#contentFrame{width:100%;height:calc(100vh - 230px);min-height:460px;border:0;border-radius:18px;background:#fff}.hidden{display:none!important}footer{margin-top:26px;color:#7b94a5;font-size:12px;text-align:right}@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{padding:20px 10px;min-height:130px}.tile strong{font-size:17px}}@media(max-width:420px){.grid{grid-template-columns:1fr}}</style><style>.panel{background:white;padding:22px;border-radius:20px;box-shadow:0 8px 24px #143b5510;margin-bottom:18px}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:grid;gap:6px;font-size:13px;font-weight:700;color:#34566d}input,select{width:100%;height:40px;border:1px solid #bed5dd;border-radius:9px;padding:8px;font:inherit}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0}.row .btn{flex-shrink:0}.buttonEditor{border:1px solid #dce8ef;border-radius:12px;padding:12px;margin:12px 0}.wide{grid-column:1/-1}.help{font-size:13px;color:#637f97}@media(max-width:700px){.form{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header><div><div class="eyebrow">EDUVIZE · KIOSEK</div><h1>Konfigurace kiosku</h1><div class="muted">Vytvářejte podstránky a tlačítka bez programování.</div></div><a class="btn primary" href="./index.html" target="_blank">Otevřít kiosek ↗</a></header><section class="panel"><div class="form"><label>Název kiosku<input id="title"></label><label>Podtitulek<input id="subtitle"></label><label>Automatický návrat po nečinnosti (sekundy, 0 = vypnuto)<input id="idle" type="number" min="0" max="3600"></label></div></section><section class="panel"><div class="row"><label style="flex:1">Upravovaná podstránka<select id="page"></select></label><button class="btn" id="newPage">+ Podstránka</button><button class="btn" id="deletePage">Smazat podstránku</button></div><label>Název podstránky<input id="pageTitle"></label><h2>Tlačítka</h2><div id="buttons"></div><button class="btn" id="addButton">+ Přidat tlačítko</button></section><section class="panel"><div class="toolbar"><button class="btn primary" id="save">Uložit konfiguraci</button><button class="btn" id="export">Export JSON</button><label class="btn" style="display:inline-block">Import JSON<input id="import" type="file" accept=".json,application/json" style="display:none"></label><button class="btn" id="reset">Obnovit ukázku</button></div><p class="help">Konfigurace se ukládá v tomto prohlížeči. Pro přenos na jiné zařízení použijte export a import JSON. Externí stránky mohou blokovat vložení do kiosku.</p><p id="status" role="status"></p></section></main><script>const DEFAULT={"title":"Vítejte v naší škole","subtitle":"Vyberte požadovanou informaci","idleSeconds":60,"pages":[{"id":"home","title":"Hlavní nabídka","buttons":[{"label":"O škole","icon":"🏫","type":"page","target":"school"},{"label":"Jízdní řády","icon":"🚌","type":"url","target":"https://pborovicka72-dotcom.github.io/eduvize-jizdni-rady/config.html"},{"label":"Počasí","icon":"🌤️","type":"url","target":"https://eduvize-weather.onrender.com/display"},{"label":"Svátky","icon":"📅","type":"url","target":"https://pborovicka72-dotcom.github.io/eduvize-svatky/"},{"label":"Web školy","icon":"🌐","type":"url","target":"https://www.example.org"}]},{"id":"school","title":"O škole","buttons":[{"label":"Kontakty","icon":"📞","type":"url","target":"https://www.example.org"},{"label":"Zpět","icon":"↩️","type":"page","target":"home"}]}]};const KEY='eduvize-kiosk-v1';function getConfig(){try{const raw=JSON.parse(localStorage.getItem(KEY));if(raw&&Array.isArray(raw.pages))return raw}catch{}return structuredClone(DEFAULT)}function saveConfig(c){localStorage.setItem(KEY,JSON.stringify(c))}
let c=getConfig(),current='home';const $=id=>document.getElementById(id);function el(tag,attrs={},value){const n=document.createElement(tag);for(const [k,v] of Object.entries(attrs))n[k]=v;if(value!==undefined)n.textContent=value;return n}function render(){ $('title').value=c.title;$('subtitle').value=c.subtitle;$('idle').value=c.idleSeconds;$('page').replaceChildren();for(const p of c.pages)$('page').append(el('option',{value:p.id},p.title));if(!c.pages.some(p=>p.id===current))current=c.pages[0].id;$('page').value=current;const p=c.pages.find(x=>x.id===current);$('pageTitle').value=p.title;$('deletePage').disabled=current==='home';$('buttons').replaceChildren();(p.buttons||[]).forEach((b,i)=>{const card=el('div',{className:'buttonEditor'});const grid=el('div',{className:'form'});function field(label,key){const l=el('label',{},label),inp=el('input',{value:b[key]||''});inp.oninput=()=>b[key]=inp.value;l.append(inp);grid.append(l)}field('Název tlačítka','label');field('Ikona (emoji)','icon');const label=el('label',{},'Typ akce'),select=el('select');for(const [v,t] of [['page','Podstránka'],['url','URL / aplikace Eduvize']])select.append(el('option',{value:v},t));select.value=b.type;select.onchange=()=>{b.type=select.value;b.target=b.type==='page'?'home':'https://';render()};label.append(select);grid.append(label);const targetLabel=el('label',{},b.type==='page'?'Cílová podstránka':'URL');if(b.type==='page'){const s=el('select');for(const pg of c.pages)s.append(el('option',{value:pg.id},pg.title));s.value=b.target;s.onchange=()=>b.target=s.value;targetLabel.append(s)}else{const inp=el('input',{value:b.target||''});inp.oninput=()=>b.target=inp.value;targetLabel.append(inp)}grid.append(targetLabel);card.append(grid);const controls=el('div',{className:'row'});for(const [txt,action] of [['↑',()=>move(i,-1)],['↓',()=>move(i,1)],['Odebrat',()=>{p.buttons.splice(i,1);render()}]]){const bt=el('button',{className:'btn',type:'button'},txt);bt.onclick=action;controls.append(bt)}card.append(controls);$('buttons').append(card)})}function move(i,d){const a=c.pages.find(x=>x.id===current).buttons,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];render()}$('page').onchange=e=>{current=e.target.value;render()};$('pageTitle').oninput=e=>{c.pages.find(x=>x.id===current).title=e.target.value;const option=$('page').selectedOptions[0];if(option)option.textContent=e.target.value};$('newPage').onclick=()=>{const id='page-'+Date.now();c.pages.push({id,title:'Nová podstránka',buttons:[]});current=id;render()};$('deletePage').onclick=()=>{if(current==='home')return;c.pages=c.pages.filter(p=>p.id!==current);for(const p of c.pages)p.buttons=p.buttons.filter(b=>b.type!=='page'||b.target!==current);current='home';render()};$('addButton').onclick=()=>{c.pages.find(x=>x.id===current).buttons.push({label:'Nové tlačítko',icon:'🔗',type:'url',target:'https://'});render()};function sync(){c.title=$('title').value;c.subtitle=$('subtitle').value;c.idleSeconds=Math.max(0,Number($('idle').value)||0)}$('save').onclick=()=>{sync();saveConfig(c);$('status').textContent='Uloženo v tomto prohlížeči.'};$('export').onclick=()=>{sync();const a=el('a',{href:URL.createObjectURL(new Blob([JSON.stringify(c,null,2)],{type:'application/json'})),download:'eduvize-kiosek.json'});a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onchange=async e=>{try{const next=JSON.parse(await e.target.files[0].text());if(!Array.isArray(next.pages)||!next.pages.some(p=>p.id==='home'))throw Error('Chybí hlavní stránka');c=next;current='home';saveConfig(c);render();$('status').textContent='Konfigurace importována.'}catch(err){$('status').textContent='Chyba importu: '+err.message}};$('reset').onclick=()=>{if(confirm('Obnovit ukázkovou konfiguraci?')){c=structuredClone(DEFAULT);current='home';saveConfig(c);render()}};render();</script></body></html>
