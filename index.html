<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eduvize | Kiosek</title><style>:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#142c46}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 95% 0,#d8f8ef,transparent 35%),#edf5fa}.wrap{max-width:1280px;margin:auto;padding:clamp(16px,3vw,42px)}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.eyebrow{font-weight:800;color:#078fa2;letter-spacing:.14em;font-size:13px}h1{margin:5px 0;font-size:clamp(28px,3.5vw,48px);letter-spacing:-.04em}.muted{color:#637f97}a{color:#087b9d}.hero{border-radius:24px;background:linear-gradient(110deg,#0874b8,#00a995);padding:32px;color:white;margin-bottom:22px;box-shadow:0 16px 35px #0b6c9a20}.hero h2{margin:0;font-size:clamp(26px,3vw,42px)}.hero p{margin-bottom:0;opacity:.9}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.tile{border:1px solid #dce8ef;border-radius:20px;background:white;padding:28px 18px;min-height:155px;text-align:center;cursor:pointer;color:#183b55;box-shadow:0 8px 25px #153b5410}.tile:hover,.tile:focus-visible{outline:3px solid #00a995;transform:translateY(-2px)}.tile .ico{font-size:40px;display:block;margin-bottom:12px}.tile strong{font-size:21px}.tile small{display:block;color:#638098;margin-top:8px}.btn{border:0;border-radius:10px;background:#e5f0f4;color:#16506c;padding:11px 16px;cursor:pointer;font-weight:750;text-decoration:none;display:inline-block}.btn.primary{background:linear-gradient(110deg,#0874b8,#00a995);color:#fff}.toolbar{display:flex;gap:10px;flex-wrap:wrap}#contentFrame{width:100%;height:calc(100vh - 230px);min-height:460px;border:0;border-radius:18px;background:#fff}.hidden{display:none!important}footer{margin-top:26px;color:#7b94a5;font-size:12px;text-align:right}@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{padding:20px 10px;min-height:130px}.tile strong{font-size:17px}}@media(max-width:420px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header><div><div class="eyebrow">EDUVIZE · KIOSEK</div><h1 id="title"></h1></div><div class="toolbar"><button id="back" class="btn hidden">← Zpět</button><button id="home" class="btn hidden">⌂ Domů</button></div></header><section id="hero" class="hero"><h2 id="sectionTitle"></h2><p id="subtitle"></p></section><div id="tiles" class="grid"></div><iframe id="contentFrame" class="hidden" title="Otevřený obsah" referrerpolicy="strict-origin-when-cross-origin"></iframe><footer>Eduvize · Interaktivní informační kiosek</footer></main><script>const DEFAULT={"title":"Vítejte v naší škole","subtitle":"Vyberte požadovanou informaci","idleSeconds":60,"pages":[{"id":"home","title":"Hlavní nabídka","buttons":[{"label":"O škole","icon":"🏫","type":"page","target":"school"},{"label":"Jízdní řády","icon":"🚌","type":"url","target":"https://pborovicka72-dotcom.github.io/eduvize-jizdni-rady/config.html"},{"label":"Počasí","icon":"🌤️","type":"url","target":"https://eduvize-weather.onrender.com/display"},{"label":"Svátky","icon":"📅","type":"url","target":"https://pborovicka72-dotcom.github.io/eduvize-svatky/"},{"label":"Web školy","icon":"🌐","type":"url","target":"https://www.example.org"}]},{"id":"school","title":"O škole","buttons":[{"label":"Kontakty","icon":"📞","type":"url","target":"https://www.example.org"},{"label":"Zpět","icon":"↩️","type":"page","target":"home"}]}]};const KEY='eduvize-kiosk-v1';function getConfig(){try{const raw=JSON.parse(localStorage.getItem(KEY));if(raw&&Array.isArray(raw.pages))return raw}catch{}return structuredClone(DEFAULT)}function saveConfig(c){localStorage.setItem(KEY,JSON.stringify(c))}
const config=getConfig();let page='home',history=[],last=Date.now(),inFrame=false;const $=id=>document.getElementById(id);$('title').textContent=config.title||'Kiosek';$('subtitle').textContent=config.subtitle||'';function activity(){last=Date.now()}['pointerdown','keydown','touchstart'].forEach(x=>document.addEventListener(x,activity));function draw(){inFrame=false;$('contentFrame').classList.add('hidden');$('contentFrame').src='about:blank';$('tiles').classList.remove('hidden');$('hero').classList.remove('hidden');const p=config.pages.find(x=>x.id===page)||config.pages[0];$('sectionTitle').textContent=p.title;$('tiles').replaceChildren();for(const item of p.buttons||[]){const b=document.createElement('button');b.className='tile';const ico=document.createElement('span');ico.className='ico';ico.textContent=item.icon||'🔗';const strong=document.createElement('strong');strong.textContent=item.label;b.append(ico,strong);b.onclick=()=>{activity();if(item.type==='page'){history.push(page);page=item.target;draw()}else if(item.target){let url;try{url=new URL(item.target,location.href);if(!['https:','http:'].includes(url.protocol))return}catch{return}$('contentFrame').src=url.href;$('contentFrame').classList.remove('hidden');$('tiles').classList.add('hidden');$('hero').classList.add('hidden');inFrame=true;updateNav()}};$('tiles').append(b)}updateNav()}function updateNav(){$('back').classList.toggle('hidden',!history.length&&!inFrame);$('home').classList.toggle('hidden',page==='home'&&!inFrame)}$('back').onclick=()=>{if(inFrame){draw()}else{page=history.pop()||'home';draw()}};$('home').onclick=()=>{history=[];page='home';draw()};setInterval(()=>{if(config.idleSeconds>0&&Date.now()-last>config.idleSeconds*1000&&(page!=='home'||inFrame)){$('home').click();activity()}},1000);draw();</script></body></html>
