<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eduvize | Kiosek</title><style>:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#142c46}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 95% 0,#d8f8ef,transparent 35%),#edf5fa}.wrap{max-width:1280px;margin:auto;padding:clamp(16px,3vw,42px)}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.eyebrow{font-weight:800;color:#078fa2;letter-spacing:.14em;font-size:13px}h1{margin:5px 0;font-size:clamp(28px,3.5vw,48px);letter-spacing:-.04em}.muted{color:#637f97}a{color:#087b9d}.hero{border-radius:24px;background:linear-gradient(110deg,#0874b8,#00a995);padding:32px;color:white;margin-bottom:22px;box-shadow:0 16px 35px #0b6c9a20}.hero h2{margin:0;font-size:clamp(26px,3vw,42px)}.hero p{margin-bottom:0;opacity:.9}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.tile{border:1px solid #dce8ef;border-radius:20px;background:white;padding:28px 18px;min-height:155px;text-align:center;cursor:pointer;color:#183b55;box-shadow:0 8px 25px #153b5410}.tile:hover,.tile:focus-visible{outline:3px solid #00a995;transform:translateY(-2px)}.tile .ico{font-size:40px;display:block;margin-bottom:12px}.tile strong{font-size:21px}.tile small{display:block;color:#638098;margin-top:8px}.btn{border:0;border-radius:10px;background:#e5f0f4;color:#16506c;padding:11px 16px;cursor:pointer;font-weight:750;text-decoration:none;display:inline-block}.btn.primary{background:linear-gradient(110deg,#0874b8,#00a995);color:#fff}.toolbar{display:flex;gap:10px;flex-wrap:wrap}#contentFrame{width:100%;height:calc(100vh - 230px);min-height:460px;border:0;border-radius:18px;background:#fff}.hidden{display:none!important}footer{margin-top:26px;color:#7b94a5;font-size:12px;text-align:right}@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{padding:20px 10px;min-height:130px}.tile strong{font-size:17px}}@media(max-width:420px){.grid{grid-template-columns:1fr}}.app-icon{width:58px;height:58px;border-radius:17px;display:grid;place-items:center;margin:0 auto 12px;background:linear-gradient(135deg,#0874b8,#00a995);color:#fff;box-shadow:0 6px 14px #0874b81c}.app-icon svg{width:30px;height:30px;display:block}.preview-tile .app-icon{width:48px;height:48px;border-radius:14px;margin:0 auto 8px}.preview-tile .app-icon svg{width:26px;height:26px}</style><style>html,body{width:100%;height:100%;overflow:hidden}body.segment-mode .wrap{width:100%;max-width:none;height:100%;padding:clamp(8px,2cqw,30px);container-type:size;display:flex;flex-direction:column}body.segment-mode header{margin-bottom:clamp(6px,2cqh,18px)}body.segment-mode .hero{padding:clamp(10px,3cqw,30px);margin-bottom:clamp(8px,2cqh,20px)}body.segment-mode .grid{flex:1;min-height:0;overflow:auto;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));align-content:start}body.segment-mode .tile{min-height:clamp(90px,20cqh,160px);padding:clamp(8px,2cqw,20px)}body.segment-mode #contentFrame{flex:1;min-height:0;height:auto}body.segment-mode footer{margin-top:auto}body.segment-mode h1{font-size:clamp(19px,3cqw,45px)}body.segment-mode .hero h2{font-size:clamp(18px,3cqw,38px)}</style></head><body><main class="wrap"><header><div><div class="eyebrow">EDUVIZE · KIOSEK</div><h1 id="title"></h1></div><div class="toolbar"><button id="back" class="btn hidden">← Zpět</button><button id="home" class="btn hidden">⌂ Domů</button></div></header><section id="hero" class="hero"><h2 id="sectionTitle"></h2><p id="subtitle"></p></section><div id="tiles" class="grid"></div><iframe id="contentFrame" class="hidden" title="Otevřený obsah" referrerpolicy="strict-origin-when-cross-origin"></iframe><footer>Eduvize · Interaktivní informační kiosek</footer></main><script>const sp=new URLSearchParams(location.search);if(sp.has('orientation')&&sp.has('style')&&sp.has('block'))document.body.classList.add('segment-mode');const DEFAULT={"title":"Vítejte v naší škole","subtitle":"Vyberte požadovanou informaci","idleSeconds":60,"pages":[{"id":"home","title":"Hlavní nabídka","buttons":[{"label":"O škole","icon":"🏫","type":"page","target":"school"},{"label":"Jízdní řády","icon":"🚌","type":"url","target":"https://pborovicka72-dotcom.github.io/eduvize-jizdni-rady/index.html?viewMode=web-pages"},{"label":"Počasí","icon":"🌤️","type":"url","target":"https://eduvize-weather.onrender.com/display"},{"label":"Svátky","icon":"📅","type":"url","target":"https://pborovicka72-dotcom.github.io/eduvize-svatky/"},{"label":"Web školy","icon":"🌐","type":"url","target":"https://www.example.org"}]},{"id":"school","title":"O škole","buttons":[{"label":"Kontakty","icon":"📞","type":"url","target":"https://www.example.org"},{"label":"Zpět","icon":"↩️","type":"page","target":"home"}]}]};DEFAULT.pages[0].buttons.splice(4,0,...[{"label":"Moudrost dne","icon":"","type":"url","target":"https://pborovicka72-dotcom.github.io/eduvize-moudrost-dne/index.html"},{"label":"Dokumenty školy","icon":"","type":"url","target":"https://pborovicka72-dotcom.github.io/eduvize-dokumenty/index.html"}]);const ICON_PATHS={"school":"<path d=\"M3 21V9l9-6 9 6v12M9 21v-7h6v7M3 10h18\"/>","transport":"<rect x=\"3\" y=\"6\" width=\"18\" height=\"13\" rx=\"2\"/><path d=\"M7 6V4h10v2M7 19v2m10-2v2M3 13h18M7 10h2m6 0h2\"/>","weather":"<path d=\"M10 14V5a2 2 0 0 1 4 0v9a5 5 0 1 1-4 0Z\"/><path d=\"M12 9v9\"/>","holidays":"<rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"/><path d=\"M7 3v4M17 3v4M3 10h18M8 15h3M14 15h3\"/>","wisdom":"<path d=\"M10 11H5V7h6v5c0 3-2 5-5 6M21 11h-5V7h6v5c0 3-2 5-5 6\"/>","documents":"<path d=\"M7 3h7l5 5v13H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z\"/><path d=\"M14 3v6h5M9 13h6M9 17h6\"/>","web":"<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M3 12h18M12 3c-5 5-5 13 0 18M12 3c5 5 5 13 0 18\"/>","contact":"<path d=\"M7 4h10a2 2 0 0 1 2 2v14H5V6a2 2 0 0 1 2-2Z\"/><path d=\"M9 9h6M9 13h6M9 17h4\"/>","back":"<path d=\"M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-2\"/>","link":"<path d=\"M10 13a5 5 0 0 0 7 .4l3-3a5 5 0 0 0-7-7l-2 2M14 11a5 5 0 0 0-7-.4l-3 3a5 5 0 0 0 7 7l2-2\"/>"};function iconKey(item){const s=((item.label||'')+' '+(item.target||'')).toLowerCase();if(/jízdní|doprava|odjezd|jizdni-rady/.test(s))return 'transport';if(/počas|weather|pocasi/.test(s))return 'weather';if(/svát|jmenin|svatky/.test(s))return 'holidays';if(/moudrost|citát|moudrost-dne/.test(s))return 'wisdom';if(/dokument|dokumenty/.test(s))return 'documents';if(/kontakt/.test(s))return 'contact';if(/zpět/.test(s))return 'back';if(/škole|school/.test(s))return 'school';if(/web|www\.|example\.org/.test(s))return 'web';return 'link'}function makeIcon(item){const wrap=document.createElement('span');wrap.className='app-icon';wrap.setAttribute('aria-hidden','true');const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('fill','none');svg.setAttribute('stroke','currentColor');svg.setAttribute('stroke-width','1.8');svg.setAttribute('stroke-linecap','round');svg.setAttribute('stroke-linejoin','round');svg.innerHTML=ICON_PATHS[iconKey(item)];wrap.append(svg);return wrap}const KEY='eduvize-kiosk-v1';function getConfig(){try{const raw=JSON.parse(localStorage.getItem(KEY));if(raw&&Array.isArray(raw.pages))return raw}catch{}return structuredClone(DEFAULT)}function saveConfig(c){localStorage.setItem(KEY,JSON.stringify(c))}
const config=getConfig();let page='home',history=[],last=Date.now(),inFrame=false;const $=id=>document.getElementById(id);$('title').textContent=config.title||'Kiosek';$('subtitle').textContent=config.subtitle||'';function activity(){last=Date.now()}['pointerdown','keydown','touchstart'].forEach(x=>document.addEventListener(x,activity));function draw(){inFrame=false;$('contentFrame').classList.add('hidden');$('contentFrame').src='about:blank';$('tiles').classList.remove('hidden');$('hero').classList.remove('hidden');const p=config.pages.find(x=>x.id===page)||config.pages[0];$('sectionTitle').textContent=p.title;$('tiles').replaceChildren();for(const item of p.buttons||[]){const b=document.createElement('button');b.className='tile';const ico=makeIcon(item);const strong=document.createElement('strong');strong.textContent=item.label;b.append(ico,strong);b.onclick=()=>{activity();if(item.type==='page'){history.push(page);page=item.target;draw()}else if(item.target){let url;try{url=new URL(item.target,location.href);if(!['https:','http:'].includes(url.protocol))return}catch{return}$('contentFrame').src=url.href;$('contentFrame').classList.remove('hidden');$('tiles').classList.add('hidden');$('hero').classList.add('hidden');inFrame=true;updateNav()}};$('tiles').append(b)}updateNav()}function updateNav(){$('back').classList.toggle('hidden',!history.length&&!inFrame);$('home').classList.toggle('hidden',page==='home'&&!inFrame)}$('back').onclick=()=>{if(inFrame){draw()}else{page=history.pop()||'home';draw()}};$('home').onclick=()=>{history=[];page='home';draw()};setInterval(()=>{if(config.idleSeconds>0&&Date.now()-last>config.idleSeconds*1000&&(page!=='home'||inFrame)){$('home').click();activity()}},1000);draw();</script></body></html>
