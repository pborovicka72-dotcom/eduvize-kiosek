<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eduvize | Nastavení Přehrávače</title>
<link rel="stylesheet" href="/eduvize-styly/design-system/admin-tokens.css"><link rel="stylesheet" href="/eduvize-styly/design-system/admin-components.css">
<link rel="stylesheet" href="player-config.css?v=1"><script defer src="/eduvize-styly/design-system/admin-auth.js"></script>
<script defer src="/eduvize-styly/design-system/output-client.js"></script><script defer src="/eduvize-styly/design-system/nsp-geometry.js"></script>
<script defer src="player-model.js?v=1"></script><script defer src="player-config.js?v=1"></script></head>
<body><main class="player-admin ev-admin"><header><p class="eyebrow">Eduvize · Přehrávač</p><h1>Nastavení Přehrávače</h1><p>Vyberte šablonu obrazovky. V každém segmentu se publikované výstupy střídají ve zvoleném pořadí a čase.</p></header>
<section class="player-card"><div class="player-controls"><label>Uložený Přehrávač<select id="existing"><option value="">Nový Přehrávač</option></select></label><button id="new" type="button">Nový Přehrávač</button></div><div class="player-controls"><label>Orientace obrazovky<select id="orientation"><option value="landscape">Na šířku</option><option value="portrait">Na výšku</option></select></label><label>Šablona segmentů<select id="layout"></select></label></div><div id="segments" class="player-segments"></div></section>
<section class="player-card"><h2>Náhled celé obrazovky</h2><iframe id="preview" title="Náhled Přehrávače" src="player.html?preview=1"></iframe></section>
<section class="player-card player-actions"><button id="publish" type="button">Uložit a publikovat</button><button id="copy" type="button" disabled>Kopírovat odkaz</button><a id="open" href="#" target="_blank" rel="noopener noreferrer" hidden>Otevřít výstup</a><p id="status" role="status" aria-live="polite">Načítám školní profil…</p></section></main></body></html>
